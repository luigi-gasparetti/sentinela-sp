name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancela a execução anterior quando chega um push novo na mesma PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, formatação e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Testes
    runs-on: ubuntu-latest
    # PostgreSQL descartável, só para os testes desta execução.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinela
          POSTGRES_PASSWORD: sentinela_ci
          POSTGRES_DB: sentinela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinela -d sentinela_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sentinela:sentinela_ci@localhost:5432/sentinela_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Aplica as migrations
        run: npm run db:migrate -w @sentinela/api
      - run: npm test

  build:
    name: Build do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
